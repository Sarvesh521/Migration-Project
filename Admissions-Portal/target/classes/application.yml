server:
  port: 8086
spring:
  application:
    name: app
  datasource:
    url: jdbc:mysql://localhost:3306/app
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    corse:
      allowed-origins: ${CORS_ALLOWED_ORIGINS} # e.g., http://localhost:3000
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}
          jwk-set-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}/protocol/openid-connect/certs
        opaquetoken:
          introspection-uri: ${KEYCLOAK_SERVER_URL}/realms/${REALM}/protocol/openid-connect/token/introspect
          client-id: ${CLIENT_ID}
          client-secret: ${CLIENT_SECRET}

keycloak:
  default-role: APPLICANT
  roles: APPLICANT,ADMIN
  auth-server-url: ${KEYCLOAK_SERVER_URL}
  realm: ${REALM}
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}
  admin:
    client-secret: ${CLIENT_SECRET}

app:
  entity-package: com.example.app.entity